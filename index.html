<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Personal Information Form</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #eef2f7;
			color: #243447;
		}
		.container {
			max-width: 760px;
			margin: 40px auto;
			padding: 30px;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 5px 20px rgba(0, 0, 0, .12);
		}
		h1 { margin-top: 0; text-align: center; color: #1769aa; }
		.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
		.field { display: flex; flex-direction: column; }
		.full { grid-column: 1 / -1; }
		label { margin-bottom: 7px; font-weight: bold; }
		input, select, textarea {
			width: 100%;
			padding: 11px;
			border: 1px solid #bcc7d3;
			border-radius: 6px;
			font-size: 15px;
		}
		textarea { resize: vertical; min-height: 90px; }
		.actions { margin-top: 22px; text-align: center; }
		button {
			padding: 12px 28px;
			border: 0;
			border-radius: 6px;
			background: #1769aa;
			color: white;
			font-size: 16px;
			cursor: pointer;
		}
		button:hover { background: #0d4f82; }
		@media (max-width: 600px) {
			.container { margin: 20px; padding: 20px; }
			.form-grid { grid-template-columns: 1fr; }
			.full { grid-column: auto; }
		}
	</style>
</head>
<body>
	<main class="container">
		<h1>Personal Information</h1>
		<form>
			<div class="form-grid">
				<div class="field">
					<label for="name">Full Name</label>
					<input type="text" id="name" name="name" placeholder="Enter your name" required>
				</div>
				<div class="field">
					<label for="age">Age</label>
					<input type="number" id="age" name="age" min="1" max="120" placeholder="Enter your age" required>
				</div>
				<div class="field">
					<label for="email">Email Address</label>
					<input type="email" id="email" name="email" placeholder="you@example.com" required>
				</div>
				<div class="field">
					<label for="phone">Phone Number</label>
					<input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
				</div>
				<div class="field">
					<label for="dob">Date of Birth</label>
					<input type="date" id="dob" name="dob" required>
				</div>
				<div class="field">
					<label for="gender">Gender</label>
					<select id="gender" name="gender" required>
						<option value="">Select gender</option>
						<option>Male</option>
						<option>Female</option>
						<option>Non-binary</option>
						<option>Prefer not to say</option>
					</select>
				</div>
				<div class="field">
					<label for="country">Country</label>
					<select id="country" name="country" required>
						<option value="">Select country</option>
						<option>India</option>
						<option>United States</option>
						<option>United Kingdom</option>
						<option>Canada</option>
						<option>Australia</option>
					</select>
				</div>
				<div class="field">
					<label for="occupation">Occupation</label>
					<input type="text" id="occupation" name="occupation" placeholder="Enter your occupation">
				</div>
				<div class="field full">
					<label for="address">Address</label>
					<textarea id="address" name="address" placeholder="Enter your address"></textarea>
				</div>
			</div>
			<div class="actions">
				<button type="submit">Submit Form</button>
			</div>
		</form>
	</main>
</body>
</html>
